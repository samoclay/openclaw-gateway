# Publish hosted-SPA artifacts (site/index.html, not the Next.js BFF).
# Merge to staging → immutable spa/<git-sha>/ then copy to the live site
# bucket and invalidate CloudFront (no terraform pin PR required).
# Merge to master/main still uploads artifacts only unless SITE_BUCKET is set.
#
# Do NOT set AWS_ROLE_ARN in workflow/job env — the AWS SDK treats that as
# web-identity config and fails before OIDC exchange.
# Do NOT default ARTIFACTS_BUCKET to the other environment's bucket.
name: Publish

on:
  push:
    branches: [master, main, staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-spa:
    name: Package SPA and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    if: github.ref_name == 'staging' || github.ref_name == 'main' || github.ref_name == 'master'
    env:
      AWS_REGION: eu-west-2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Use latest npm CLI
        run: npm install -g npm@latest

      - name: Install from lockfile
        run: npm ci

      - name: Audit high+ vulnerabilities
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build portal (verify only; not an AWS artifact)
        run: npm run build -w portal

      - name: Package hosted SPA
        run: bash scripts/package-spa.sh

      - name: Require artifact publish config
        id: cfg
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          role_staging=no
          case "$ROLE" in *Staging*) role_staging=yes ;; esac
          echo "publish_diag ref=$GITHUB_REF_NAME role_staging=$role_staging bucket=$([ -n "$BUCKET" ] && echo set || echo empty)"
          s3=0
          if [ -n "$ROLE" ] && [ -n "$BUCKET" ]; then
            if [ "$GITHUB_REF_NAME" = "staging" ]; then
              s3=1
            elif [ "$role_staging" = "yes" ]; then
              echo "::warning::Skipping S3: production Environment points at BURoleForOpenclawSiteDeployStaging; that role only trusts environment:staging + ref staging. Unset AWS_ROLE_ARN on GitHub Environment production, or set the production role."
            else
              s3=1
            fi
          elif [ "$GITHUB_REF_NAME" = "staging" ]; then
            echo "::error::Set GitHub Environment variables AWS_ROLE_ARN and ARTIFACTS_BUCKET on staging."
            exit 1
          else
            echo "::warning::Skipping S3: production Environment has no AWS_ROLE_ARN/ARTIFACTS_BUCKET."
          fi
          echo "s3=$s3" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.s3 == '1'
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload immutable SPA to artifact bucket
        if: steps.cfg.outputs.s3 == '1'
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          prefix="s3://${ARTIFACTS_BUCKET}/spa/${GITHUB_SHA}"
          aws s3 cp dist/spa/index.html "${prefix}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --checksum-algorithm SHA256
          aws s3 cp dist/spa/manifest.json "${prefix}/manifest.json" \
            --content-type "application/json" \
            --checksum-algorithm SHA256
          echo "Published ${prefix}/"

      - name: Promote SPA to the live staging site
        if: github.ref_name == 'staging' && steps.cfg.outputs.s3 == '1'
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          site="${SITE_BUCKET:-}"
          if [ -z "$site" ]; then
            site="${ARTIFACTS_BUCKET/-artifacts-/-}"
          fi
          dist="${CLOUDFRONT_DISTRIBUTION_ID:-E2PGUES7KEVWW0}"
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/spa/${GITHUB_SHA}/index.html" "s3://${site}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --checksum-algorithm SHA256
          aws cloudfront create-invalidation --distribution-id "$dist" --paths /index.html /
          echo "Live staging site updated from spa/${GITHUB_SHA} bucket=${site} dist=${dist}"

      - name: Open or update sam-terraform staging pin PR
        if: github.ref_name == 'staging' && steps.cfg.outputs.s3 == '1'
        env:
          GH_TOKEN: ${{ secrets.SAM_TERRAFORM_TOKEN }}
          SPA_SHA: ${{ github.sha }}
          TF_REPO: samoclay/sam-terraform
          PIN_BRANCH: bots/openclaw-spa-pin
          BASE_BRANCH: main
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SPA uploaded but SAM_TERRAFORM_TOKEN is unset; skipped sam-terraform pin PR."
            exit 0
          fi
          # gh clone uses GH_TOKEN; raw git push does not unless the helper is installed.
          gh auth setup-git
          tmp=$(mktemp -d)
          gh repo clone "$TF_REPO" "$tmp" -- --branch "$BASE_BRANCH" --depth 1
          cd "$tmp"
          git config user.name "openclaw-publish[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PIN_BRANCH"

          tfvars=envs/staging/staging.tfvars
          if [[ ! -f "$tfvars" ]]; then
            echo "::error::$tfvars missing on $BASE_BRANCH."
            exit 1
          fi
          if grep -qE '^[[:space:]]*openclaw_spa_version[[:space:]]*=' "$tfvars"; then
            sed -i.bak -E "s|^[[:space:]]*openclaw_spa_version[[:space:]]*=.*|openclaw_spa_version = \"$SPA_SHA\"|" "$tfvars"
          elif grep -qE '^[[:space:]]*#[[:space:]]*openclaw_spa_version' "$tfvars"; then
            sed -i.bak -E "s|^[[:space:]]*#[[:space:]]*openclaw_spa_version[[:space:]]*=.*|openclaw_spa_version = \"$SPA_SHA\"|" "$tfvars"
          else
            printf '\nopenclaw_spa_version = "%s"\n' "$SPA_SHA" >> "$tfvars"
          fi
          rm -f "${tfvars}.bak"

          if git diff --quiet; then
            echo "Pin already at $SPA_SHA; nothing to do"
            exit 0
          fi

          body="Auto-opened by openclaw Publish after uploading spa/$SPA_SHA/ to the staging artifacts bucket. Merge into main to apply staging. Source: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git add "$tfvars"
          git commit -m "chore(openclaw): pin spa ${SPA_SHA:0:12} for staging"
          git push -u origin "$PIN_BRANCH" --force

          title="chore(openclaw): pin SPA ${SPA_SHA:0:12} (staging)"
          if gh pr view "$PIN_BRANCH" --repo "$TF_REPO" --json number -q .number >/dev/null 2>&1; then
            gh pr edit "$PIN_BRANCH" --repo "$TF_REPO" --title "$title" --body "$body"
            echo "Updated existing pin PR for $SPA_SHA"
          else
            gh pr create --repo "$TF_REPO" --base "$BASE_BRANCH" --head "$PIN_BRANCH" \
              --title "$title" --body "$body"
            echo "Opened pin PR for $SPA_SHA"
          fi
