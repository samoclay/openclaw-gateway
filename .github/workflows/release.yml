# Semver bump + GitHub Release on merge to master/main. Staging does not bump.
name: Release

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  release:
    name: Bump VERSION and tag
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x scripts/bump-release.sh
          ver="$(bash scripts/bump-release.sh "OpenClaw portal")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md RELEASE.md
          git commit -m "chore(release): v${ver}"
          git tag "v${ver}"
          git push origin HEAD
          git push origin "v${ver}"
          gh release create "v${ver}" --title "OpenClaw v${ver}" --notes-file RELEASE.md
