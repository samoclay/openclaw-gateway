<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halcyon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --raised: #0b0b0e;
      --surface-2: #141419;
      --line: rgba(246, 196, 83, 0.14);
      --line-strong: rgba(246, 196, 83, 0.30);
      --text: #f5f2ea;
      --muted: #b5afa1;
      --accent: #f6c453;
      --magenta: #e0902b;
      --danger: #ff6b7a;
      --warn: #f5c16c;
      --glow-gold: 0 0 22px rgba(246, 196, 83, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(55% 45% at 12% -8%, rgba(246, 196, 83, 0.06), transparent 60%),
        radial-gradient(50% 40% at 100% 0%, rgba(224, 144, 43, 0.05), transparent 55%);
      background-attachment: fixed;
      color: var(--text);
    }
    a { color: var(--accent); text-decoration: none; }
    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      min-height: 44px;
      padding: 0.55rem 1.15rem;
    }
    button:disabled, .accent:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .accent { background: var(--accent); color: #1a1206; font-weight: 600; }
    .accent:hover:not(:disabled) { box-shadow: var(--glow-gold); }
    .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line-strong); }
    .ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .ghost.active { border-color: var(--accent); color: var(--accent); }
    a.ghost {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      color: var(--muted);
    }
    a.ghost:hover { border-color: var(--accent); color: var(--text); }
    a.ghost.active { border-color: var(--accent); color: var(--accent); }
    .wrap { max-width: 56rem; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
    .wrap.wide { max-width: 74rem; }
    .kicker {
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 500;
      margin: 0 0 0.4rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.85rem; font-weight: 200; letter-spacing: 0.01em; }
    h2 { margin: 0 0 0.4rem; }
    h3 { margin: 0.9rem 0 0.35rem; font-size: 1rem; }
    .muted { color: var(--muted); }
    header.bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin: 0 -1.25rem 1.5rem;
      padding: 0.9rem 1.25rem 1rem;
      background: rgba(0, 0, 0, 0.9);
      border-bottom: 1px solid rgba(246, 196, 83, 0.08);
      backdrop-filter: blur(12px);
    }
    .banner {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .card {
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
    }
    .card h2 { margin: 0; font-size: 1.6rem; }
    .card p { margin: 0.25rem 0 0; font-size: 0.82rem; color: var(--muted); }
    .delta-up { color: var(--accent); }
    .delta-down { color: var(--danger); }
    .sev-high { color: var(--danger); }
    .sev-medium { color: var(--warn); }
    .sev-low { color: var(--accent); }
    .charts {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 720px) {
      .charts { grid-template-columns: 1fr; }
    }
    .chart { width: 100%; height: auto; display: block; }
    .mix { display: grid; gap: 0.7rem; margin-top: 0.75rem; }
    .mix-row { display: grid; gap: 0.25rem; }
    .mix-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .mix-track {
      height: 8px;
      border-radius: 99px;
      background: #000;
      overflow: hidden;
    }
    .mix-fill {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
    }
    .insights { display: grid; gap: 0.75rem; }
    .insight { display: block; }
    .insight:hover { border-color: var(--accent); }
    .insight h3 { margin: 0.35rem 0 0; font-size: 1.05rem; color: var(--text); }
    .meta {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .gate, .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .login main, .gate main { max-width: 28rem; }
    ul.evidence { margin: 0.5rem 0 0; padding-left: 1.1rem; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
    .err { color: var(--danger); }
    .nav { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .pill {
      font-size: 0.78rem;
      border-radius: 99px;
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .pill.on { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--accent); }
    .pill.off { border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); color: var(--danger); }
    .admin-grid {
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 960px) {
      .admin-grid { grid-template-columns: 1fr; }
    }
    .host-table { width: 100%; border-collapse: collapse; }
    .host-table th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--line);
    }
    .host-table td {
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--line);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .user-list { display: grid; gap: 0.4rem; max-height: 28rem; overflow: auto; }
    .user-row {
      text-align: left;
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.85rem 0.9rem;
    }
    .user-row:hover { border-color: var(--line-strong); background: var(--raised); }
    .user-row.sel { border-color: var(--accent); background: var(--surface-2); }
    .user-row small { display: block; color: var(--muted); font-size: 0.78rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.5rem 0; }
    .chip {
      font-size: 0.72rem;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 0.15rem 0.55rem;
      color: var(--muted);
    }
    .stack { display: grid; gap: 0.75rem; }
    .field { display: grid; gap: 0.3rem; margin-bottom: 0.65rem; }
    .field label { font-size: 0.75rem; color: var(--muted); }
    .field input, .field select {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
    }
    .sun {
      position: relative;
      display: inline-flex;
      width: 1.65rem;
      height: 1.65rem;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
    }
    .sun__core {
      width: 0.72rem;
      height: 0.72rem;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0.45em rgba(246, 196, 83, 0.7), inset 0 0 0.25em rgba(246, 196, 83, 0.35);
    }
    .sun .saturn {
      position: absolute;
      inset: -0.15rem;
      transform: rotateX(72deg);
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .sun.is-running .saturn { animation: orbit 7s linear infinite; }
    .sun.is-running .sun__core { animation: planetPulse 3.4s ease-in-out infinite; }
    .saturn__ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(246, 196, 83, 0.85);
    }
    .saturn__ring--outer {
      inset: -0.18rem;
      border-color: rgba(246, 196, 83, 0.35);
    }
    @keyframes orbit {
      from { transform: rotateX(72deg) rotateZ(0deg); }
      to { transform: rotateX(72deg) rotateZ(360deg); }
    }
    @keyframes planetPulse {
      0%, 100% { box-shadow: 0 0 0.4em rgba(246, 196, 83, 0.55); }
      50% { box-shadow: 0 0 0.85em rgba(246, 196, 83, 0.95); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sun.is-running .saturn { animation: none; }
      .sun.is-running .sun__core { animation: planetPulse 3.4s ease-in-out infinite; }
    }
    .desk {
      display: grid;
      grid-template-columns: minmax(14rem, 18rem) 1fr;
      gap: 1.5rem;
      min-height: 75vh;
    }
    @media (max-width: 840px) {
      .desk { grid-template-columns: 1fr; }
    }
    .roster { display: grid; gap: 0.45rem; align-content: start; }
    .agent-box {
      display: flex;
      gap: 0.65rem;
      align-items: center;
      text-align: left;
      width: 100%;
      background: var(--raised);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.7rem 0.8rem;
    }
    .agent-box.sel {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 4%, var(--raised));
      box-shadow: inset 0 0 12px rgba(246, 196, 83, 0.05);
    }
    .agent-box small { display: block; color: var(--muted); font-size: 0.75rem; }
    .room {
      display: flex;
      flex-direction: column;
      min-height: 70vh;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--raised);
      overflow: hidden;
    }
    .bubbles {
      flex: 1;
      overflow: auto;
      padding: 1rem;
      display: grid;
      gap: 0.7rem;
      align-content: start;
    }
    .bubble {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.7rem 0.85rem;
      background: #000;
    }
    .bubble header {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      margin-bottom: 0.35rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 0.65rem;
      padding: 1.1rem 1.15rem;
      border-top: 1px solid var(--line);
    }
    .composer input, .composer textarea {
      flex: 1;
      min-height: 52px;
      font: inherit;
      color: var(--text);
      background: #000;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      outline: none;
      resize: none;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer .accent, .composer .ghost { min-height: 52px; padding: 0 1.6rem; font-size: 1rem; }
    .err-card { border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const TOKENS = "halcyon_tokens";
    const VERIFIER = "halcyon_pkce_verifier";
    const STATE = "halcyon_oauth_state";
    const SAMPLE_TENANT = "sample";

    const app = document.getElementById("app");
    let cfg = null;
    let me = null;

    function isoDay(offset) {
      const day = new Date();
      day.setUTCHours(12, 0, 0, 0);
      day.setUTCDate(day.getUTCDate() + offset);
      return day.toISOString().slice(0, 10);
    }

    function buildSample() {
      const periodStart = isoDay(-30);
      const periodEnd = isoDay(0);
      const created = periodEnd + "T09:00:00Z";
      const chats = [14, 16, 15, 18, 22, 19, 21, 18, 22, 19, 31, 27, 24, 29];
      const series = chats.map((count, i) => ({ date: isoDay(-13 + i), chats: count }));
      return {
        metrics: {
          tenantId: SAMPLE_TENANT,
          metricDate: periodEnd,
          chats: 29,
          inferenceFailures: 2,
          toolCalls: 41,
          series: series,
          source: "sample",
        },
        intents: [
          { label: "Order status", pct: 68 },
          { label: "Delivery", pct: 22 },
          { label: "Other", pct: 10 },
        ],
        insights: [
          {
            tenantId: SAMPLE_TENANT,
            insightId: "demo-support-sample",
            createdAt: created,
            periodStart: periodStart,
            periodEnd: periodEnd,
            category: "Customer Support",
            title: "Delivery enquiries have increased",
            summary: "Delivery-related questions increased 31% over the previous 30 days.",
            evidence: ["1,842 support interactions analysed.", "Peak on weekday mornings."],
            confidence: "high",
            severity: "high",
            recommendedAction: "Create an automated delivery-status workflow.",
            status: "new",
            source: "sample",
          },
          {
            tenantId: SAMPLE_TENANT,
            insightId: "demo-usage-sample",
            createdAt: created,
            periodStart: periodStart,
            periodEnd: periodEnd,
            category: "AI usage",
            title: "Agent chats concentrated in one workflow",
            summary: "68% of chats this week asked for the same status check.",
            evidence: ["412 chats reviewed.", "Top intent: order status."],
            confidence: "medium",
            severity: "medium",
            recommendedAction: "Publish a pinned status skill for that workflow.",
            status: "new",
            source: "sample",
          },
          {
            tenantId: SAMPLE_TENANT,
            insightId: "demo-tools-sample",
            createdAt: created,
            periodStart: periodStart,
            periodEnd: periodEnd,
            category: "Reliability",
            title: "One tool accounts for most failures",
            summary: "The inventory lookup tool failed 14 times in 7 days.",
            evidence: ["14 failed tool calls.", "No prompt text stored."],
            confidence: "high",
            severity: "medium",
            recommendedAction: "Retry with backoff or alert when inventory is unreachable.",
            status: "new",
            source: "sample",
          },
        ],
      };
    }

    const SAMPLE = buildSample();

    function sampleInsight(id) {
      return SAMPLE.insights.find((row) => row.insightId === id) || null;
    }

    function isSampleInsight(insight) {
      return !!(insight && (insight.tenantId === SAMPLE_TENANT || sampleInsight(insight.insightId)));
    }

    function route() {
      const hash = location.hash.replace(/^#/, "") || "/";
      if (hash === "/admin" || hash.startsWith("/admin/")) return { name: "admin" };
      if (hash === "/insights") return { name: "home" };
      if (hash === "/workspace" || hash === "/") return { name: "workspace" };
      const detail = hash.match(/^\/insight\/([^/]+)$/);
      if (detail) return { name: "detail", id: decodeURIComponent(detail[1]) };
      return { name: "home" };
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function b64url(bytes) {
      let bin = "";
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function fromB64url(text) {
      const pad = text.replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    const HOP_SALT = new TextEncoder().encode("halcyon-hop-v1");

    async function hopGenerate() {
      return crypto.subtle.generateKey({ name: "X25519" }, true, ["deriveBits"]);
    }

    async function hopExportRaw(pair) {
      return new Uint8Array(await crypto.subtle.exportKey("raw", pair.publicKey));
    }

    async function hopImportRaw(bytes) {
      return crypto.subtle.importKey("raw", bytes, { name: "X25519" }, true, []);
    }

    async function hopAesKey(myPrivate, peerRaw, sandboxId, threadId) {
      const peer = await hopImportRaw(peerRaw);
      const secret = await crypto.subtle.deriveBits(
        { name: "X25519", public: peer },
        myPrivate,
        256,
      );
      const ikm = await crypto.subtle.importKey("raw", secret, "HKDF", false, ["deriveKey"]);
      const info = new TextEncoder().encode(sandboxId + ":" + threadId);
      return crypto.subtle.deriveKey(
        { name: "HKDF", hash: "SHA-256", salt: HOP_SALT, info: info },
        ikm,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"],
      );
    }

    async function hopSeal(myPrivate, peerRaw, sandboxId, threadId, payload) {
      const key = await hopAesKey(myPrivate, peerRaw, sandboxId, threadId);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const aad = new TextEncoder().encode(sandboxId + ":" + threadId);
      const ct = new Uint8Array(
        await crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv, additionalData: aad },
          key,
          new TextEncoder().encode(JSON.stringify(payload)),
        ),
      );
      const blob = new Uint8Array(iv.length + ct.length);
      blob.set(iv, 0);
      blob.set(ct, iv.length);
      return b64url(blob);
    }

    async function hopOpen(myPrivate, peerRaw, sandboxId, threadId, sealed) {
      const key = await hopAesKey(myPrivate, peerRaw, sandboxId, threadId);
      const blob = fromB64url(sealed);
      const iv = blob.slice(0, 12);
      const ct = blob.slice(12);
      const aad = new TextEncoder().encode(sandboxId + ":" + threadId);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv, additionalData: aad },
        key,
        ct,
      );
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function sunHtml(running) {
      return '<span class="sun' + (running ? " is-running" : "") + '" aria-hidden="true">' +
        '<span class="sun__core"></span>' +
        '<span class="saturn"><span class="saturn__ring saturn__ring--outer"></span><span class="saturn__ring"></span></span>' +
      "</span>";
    }

    function formatChainError(err) {
      if (err && err.title && err.detail) {
        return "<strong>" + esc(err.title) + "</strong> · " + esc(err.stage || "") + "<br>" + esc(err.detail);
      }
      return esc((err && (err.error || err.message)) || "Something went wrong");
    }

    function randomUrl(len) {
      const bytes = new Uint8Array(len);
      crypto.getRandomValues(bytes);
      return b64url(bytes);
    }

    async function challenge(verifier) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
      return b64url(new Uint8Array(digest));
    }

    function tokens() {
      try { return JSON.parse(sessionStorage.getItem(TOKENS) || "null"); }
      catch { return null; }
    }

    function saveTokens(data) {
      sessionStorage.setItem(TOKENS, JSON.stringify(data));
    }

    function signOut() {
      sessionStorage.removeItem(TOKENS);
      location.hash = "#/";
      me = null;
      loginView("");
    }

    function redirectUri() {
      return "https://" + cfg.host + "/";
    }

    async function startLogin() {
      const verifier = randomUrl(64);
      const state = randomUrl(16);
      sessionStorage.setItem(VERIFIER, verifier);
      sessionStorage.setItem(STATE, state);
      const ch = await challenge(verifier);
      location.href =
        "https://" + cfg.cognitoDomain + "/login"
        + "?client_id=" + encodeURIComponent(cfg.cognitoClientId)
        + "&response_type=code"
        + "&scope=" + encodeURIComponent("email openid profile")
        + "&redirect_uri=" + encodeURIComponent(redirectUri())
        + "&code_challenge_method=S256"
        + "&code_challenge=" + encodeURIComponent(ch)
        + "&state=" + encodeURIComponent(state);
    }

    async function exchangeCode(code, state) {
      if (state && sessionStorage.getItem(STATE) && state !== sessionStorage.getItem(STATE)) {
        throw new Error("invalid oauth state");
      }
      const verifier = sessionStorage.getItem(VERIFIER);
      if (!verifier) throw new Error("missing PKCE verifier — start login from this browser");
      const body = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: cfg.cognitoClientId,
        code: code,
        redirect_uri: redirectUri(),
        code_verifier: verifier,
      });
      const res = await fetch("https://" + cfg.cognitoDomain + "/oauth2/token", {
        method: "POST",
        headers: { "content-type": "application/x-www-form-urlencoded" },
        body: body,
      });
      const data = await res.json();
      if (!res.ok || !data.id_token) {
        throw new Error(data.error_description || data.error || "token exchange failed");
      }
      sessionStorage.removeItem(VERIFIER);
      sessionStorage.removeItem(STATE);
      saveTokens(data);
      history.replaceState({}, "", "/");
    }

    async function api(path, options) {
      const t = tokens();
      const res = await fetch(path, {
        ...options,
        headers: {
          authorization: "Bearer " + (t && t.id_token ? t.id_token : ""),
          "content-type": "application/json",
          ...(options && options.headers),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data.title && data.detail
          ? (data.title + " — " + data.detail)
          : (data.error || data.message || ("HTTP " + res.status));
        throw new Error(msg);
      }
      return data;
    }

    function wowDelta(series) {
      const values = (series || []).map((point) => Number(point.chats) || 0);
      if (values.length < 14) return null;
      const last = values.slice(-7).reduce((sum, n) => sum + n, 0);
      const prev = values.slice(-14, -7).reduce((sum, n) => sum + n, 0);
      if (!prev) return null;
      return Math.round(((last - prev) / prev) * 100);
    }

    function areaChart(series) {
      const values = (series || []).map((point) => Number(point.chats) || 0);
      if (!values.length) return '<p class="muted">No volume yet.</p>';
      const width = 560;
      const height = 140;
      const pad = 10;
      const max = Math.max(1, ...values);
      const last = values.length - 1;
      const x = (i) => pad + (last === 0 ? 0 : (i / last) * (width - pad * 2));
      const y = (v) => height - pad - (v / max) * (height - pad * 2);
      const line = values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
      const area = line + " L" + x(last).toFixed(1) + " " + (height - pad) + " L" + x(0).toFixed(1) + " " + (height - pad) + " Z";
      const firstDate = series[0].date || "";
      const lastDate = series[series.length - 1].date || "";
      return (
        '<svg class="chart" viewBox="0 0 ' + width + " " + height + '" role="img" aria-label="Chat volume">' +
          '<path d="' + area + '" fill="color-mix(in srgb, var(--accent) 22%, transparent)"></path>' +
          '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2"></path>' +
        "</svg>" +
        '<p class="muted">' + firstDate + " – " + lastDate + "</p>"
      );
    }

    function intentMix(intents) {
      return '<div class="mix">' + (intents || []).map((row) =>
        '<div class="mix-row">' +
          '<div class="mix-label"><span>' + row.label + "</span><span>" + row.pct + "%</span></div>" +
          '<div class="mix-track"><span class="mix-fill" style="width:' + row.pct + '%"></span></div>' +

    function capacityCount(health) {
      if (!health) return 0;
      if (typeof health.capacity === "number") return health.capacity;
      const hosts = health.hosts;
      if (Array.isArray(hosts)) return hosts.length;
      return health.sidecar ? 1 : 0;
    }

    function capacityBody(value) {
      if (!value || value === "pool") {
        return { capacityMode: "pool", pinnedHostId: "", capacity: "pool" };
      }
      return { capacityMode: "pin", pinnedHostId: value, capacity: value };
    }

    function capacityPill(health) {
      const n = capacityCount(health);
      if (n > 0) {

      return '<span class="pill off">Capacity offline</span>';

    function renderHome(insights, metrics, options) {

    async function renderWorkspace(boxes) {
      const list = boxes || [];
      const currentId = (function () {
        try { return sessionStorage.getItem("halcyon_sandbox") || (list[0] && list[0].sandboxId) || ""; }
        catch { return (list[0] && list[0].sandboxId) || ""; }
      })();
      const current = list.find((row) => row.sandboxId === currentId) || list[0];
      if (!current) {
        shell(
          '<p class="banner">' + formatChainError({
            title: "No environment yet",
            stage: "portal",
            detail: "You do not have an isolated environment. An admin must grant one in Access.",
          }) + "</p>",
          { title: "Workspace", wide: true },
        );
        return;
      }
      sessionStorage.setItem("halcyon_sandbox", current.sandboxId);
      let roster;
      let health;
      try {
        const [rolesRes, healthRes] = await Promise.all([
          api("/api/sandboxes/" + encodeURIComponent(current.sandboxId) + "/roles"),
          api("/api/health").catch(() => ({ sidecar: false })),
        ]);
        roster = rolesRes;
        health = healthRes;
      } catch (err) {
        shell('<p class="err">' + esc(err.message) + "</p>", { title: "Workspace", wide: true });
        return;
      }
      const roles = [roster.defaultRole].concat(roster.roles || []).filter(Boolean);
      const sidecarOn = !!health.sidecar;
      const state = {
        sandbox: current,
        roles: roles,
        selected: "default",
        mention: "",
        threadId: sessionStorage.getItem("halcyon_thread_" + current.sandboxId) || "",
        bubbles: [],
        pending: false,
        running: "",
        hop: null,
        note: "",
        persist: false,
      };

      async function roomStore() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open("halcyon-workspace", 1);
          req.onupgradeneeded = () => req.result.createObjectStore("rooms");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function roomKeyName() {
        const t = tokens();
        let sub = "anon";
        try {
          const payload = JSON.parse(atob(t.id_token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
          sub = payload.sub || "anon";
        } catch { /* ignore */ }
        return sub + ":" + current.sandboxId + ":" + (state.threadId || "none");
      }

      async function loadBubbles() {
        if (!state.threadId) return;
        try {
          const db = await roomStore();
          const row = await new Promise((resolve, reject) => {
            const tx = db.transaction("rooms").objectStore("rooms").get(roomKeyName());
            tx.onsuccess = () => resolve(tx.result);
            tx.onerror = () => reject(tx.error);
          });
          if (row && Array.isArray(row.bubbles)) state.bubbles = row.bubbles;
        } catch {
          state.note = "History will not be saved on this device. Live chat continues in memory.";
        }
      }

      async function saveBubbles() {
        if (!state.threadId) return;
        try {
          const db = await roomStore();
          await new Promise((resolve, reject) => {
            const tx = db.transaction("rooms", "readwrite").objectStore("rooms").put(
              { bubbles: state.bubbles },
              roomKeyName(),
            );
            tx.onsuccess = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } catch { /* memory only */ }
      }
      async function paint() {
        const switcher = list.length > 1
          ? '<div class="field"><label>Environment</label><select id="sbx">' +
            list.map((row) =>
              '<option value="' + esc(row.sandboxId) + '"' + (row.sandboxId === current.sandboxId ? " selected" : "") + ">" +
              esc(row.name) + "</option>"
            ).join("") + "</select></div>"
          : "";
        const rosterHtml = roles.map((role) =>
          '<button type="button" class="agent-box' + (state.selected === role.roleId ? " sel" : "") + '" data-role="' + esc(role.roleId) + '">' +
            sunHtml(state.running === role.roleId) +
            "<span><strong>" + esc(role.displayName) + "</strong><small>" +
            (state.running === role.roleId ? "Running" : "Idle") + "</small></span></button>"
        ).join("");
        const bubbles = (state.bubbles.length ? state.bubbles : [{ role: "system", text: "Ask this crew. Use @Name to hand off to another agent." }]).map((row) => {
          const running = row.roleId && state.running === row.roleId && row.role !== "you";
          return '<article class="bubble' + (row.err ? " err-card" : "") + '"><header>' +
            (row.role === "you" ? "" : sunHtml(!!running)) +
            esc(row.label || row.role) + "</header><div>" + esc(row.text) + "</div></article>";
        }).join("");
        const banner = '<p class="banner">' +
          capacityPill(health) +
          (state.note ? ' <span class="muted">' + esc(state.note) + "</span>" : "") +
        "</p>";
        shell(
          banner + switcher +
          '<div class="desk">' +
            '<aside class="roster">' + rosterHtml +
              '<form id="add-role" class="card"><div class="field"><label>New agent</label><input name="name" placeholder="Display name" required></div>' +
              '<button class="accent" type="submit"' + (sidecarOn ? "" : " disabled") + ">Add</button></form>" +
            "</aside>" +
            '<section class="room"><div class="bubbles" id="bubbles">' + bubbles + "</div>" +
              '<form class="composer" id="chat">' +
                '<textarea id="msg" rows="1" placeholder="Message this crew… @Name to hand off" ' + (sidecarOn && !state.pending ? "" : "disabled") + "></textarea>" +
                '<button class="accent" type="submit"' + (sidecarOn && !state.pending ? "" : " disabled") + ">Send</button>" +
                '<button class="ghost" type="button" id="new-thread">New thread</button>' +
              "</form></section>" +
          "</div>",
          { title: current.name || "Workspace", sub: (me && me.email ? me.email : "") + " — crew room", wide: true, health: health },
        );
        const sbx = document.getElementById("sbx");
        if (sbx) sbx.onchange = () => {
          sessionStorage.setItem("halcyon_sandbox", sbx.value);
          renderWorkspace(list);
        };
        app.querySelectorAll("[data-role]").forEach((btn) => {
          btn.onclick = () => { state.selected = btn.getAttribute("data-role"); paint(); };
        });
        document.getElementById("new-thread").onclick = () => {
          state.threadId = "";
          state.hop = null;
          state.bubbles = [];
          sessionStorage.removeItem("halcyon_thread_" + current.sandboxId);
          paint();
        };
        document.getElementById("add-role").onsubmit = async (event) => {
          event.preventDefault();
          const name = event.target.name.value.trim();
          if (!name) return;
          try {
            await api("/api/sandboxes/" + encodeURIComponent(current.sandboxId) + "/roles", {
              method: "POST",
              body: JSON.stringify({ name: name }),
            });
            await renderWorkspace(list);
          } catch (err) {
            state.note = err.message;
            paint();
          }
        };
        document.getElementById("chat").onsubmit = (event) => {
          event.preventDefault();
          sendTurn();
        };
      }

      function waitForAssign(ws) {
        return new Promise((resolve, reject) => {
          function cleanup() {
            ws.removeEventListener("message", onMessage);
            ws.removeEventListener("close", onClose);
          }
          function onMessage(event) {
            let msg;
            try { msg = JSON.parse(event.data); } catch { return; }
            if (msg.type === "assign" && msg.threadId && msg.pubKey) {
              cleanup();
              resolve(msg);
              return;
            }
            if (msg.type === "error") {
              cleanup();
              reject(Object.assign(new Error(msg.error || "assign"), {
                title: msg.title,
                stage: msg.stage,
                detail: msg.detail,
              }));
            }
          }
          function onClose() {
            cleanup();
            reject(Object.assign(new Error("ws"), {
              title: "Capacity is offline",
              stage: "sidecar",
              detail: "The portal reached our servers, but the inference host is not connected. Chat stays disabled until capacity shows connected.",
            }));
          }
          ws.addEventListener("message", onMessage);
          ws.addEventListener("close", onClose);
        });
      }

      async function ensureHop(assigned) {
        if (state.threadId !== assigned.threadId || (state.hop && state.hop.hostId !== assigned.hostId)) {
          state.hop = null;
        }
        state.threadId = assigned.threadId;
        sessionStorage.setItem("halcyon_thread_" + current.sandboxId, assigned.threadId);
        if (state.hop) return state.hop;
        if (!assigned.pubKey) throw Object.assign(new Error("crypto"), {
          title: "Could not start a private session",
          stage: "browser",
          detail: "This browser could not agree encryption keys with the inference host. Refresh and try again.",
        });
        const pair = await hopGenerate();
        state.hop = { pair: pair, peer: fromB64url(assigned.pubKey), hostId: assigned.hostId };
        return state.hop;
      }

      function mentionFromText(text) {
        const match = text.match(/@([A-Za-z0-9._-]+)/);
        if (match) {
          const hit = roles.find((role) => role.displayName.toLowerCase() === match[1].toLowerCase() || role.roleId === match[1]);
          if (hit && hit.roleId !== "default") return hit.roleId;
        }
        const siblings = roles.filter((role) => role.roleId && role.roleId !== "default");
        for (const role of siblings) {
          const name = String(role.displayName || "").trim();
          if (name.length < 2) continue;
          const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const word = new RegExp("(?:^|[^A-Za-z0-9])" + escaped + "(?:[^A-Za-z0-9]|$)", "i");
          if (word.test(text)) return role.roleId;
        }
        return "";
      }

      async function sendTurn() {
        const input = document.getElementById("msg");
        const text = (input && input.value || "").trim();
        if (!text || state.pending) return;
        input.value = "";
        state.pending = true;
        state.bubbles.push({ role: "you", label: "You", text: text });
        await paint();
        try {
          const t = tokens() || {};
          const ws = new WebSocket("wss://" + cfg.wsHost + "?token=" + encodeURIComponent(t.access_token || t.id_token || ""));
          await new Promise((resolve, reject) => {
            ws.onopen = () => resolve();
            ws.onerror = () => {
              reject(Object.assign(new Error("ws"), {
                title: "Capacity is offline",
                stage: "sidecar",
                detail: "The portal reached our servers, but the inference host is not connected. Chat stays disabled until capacity shows connected.",
              }));
            };
          });
          const assignBody = { type: "assign", sandboxId: current.sandboxId };
          if (state.threadId) assignBody.threadId = state.threadId;
          ws.send(JSON.stringify(assignBody));
          const assigned = await waitForAssign(ws);
          const hop = await ensureHop(assigned);
          const mentionRoleId = mentionFromText(text) || (state.selected !== "default" ? state.selected : "");
          const sealed = await hopSeal(hop.pair.privateKey, hop.peer, current.sandboxId, state.threadId, { message: text });
          const body = {
            sandboxId: current.sandboxId,
            threadId: state.threadId,
            clientPubKey: b64url(await hopExportRaw(hop.pair)),
            sealed: sealed,
          };
          if (mentionRoleId) body.mentionRoleId = mentionRoleId;
          ws.send(JSON.stringify(body));
          ws.onmessage = async (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch { return; }
            if (msg.type === "ack" && msg.threadId) {
              if (state.threadId && state.threadId !== msg.threadId) state.hop = null;
              state.threadId = msg.threadId;
              sessionStorage.setItem("halcyon_thread_" + current.sandboxId, msg.threadId);
            }
            if (msg.type === "error") {
              state.pending = false;
              state.running = "";
              state.bubbles.push({ role: "error", label: "Error", text: (msg.title || msg.error || "") + " — " + (msg.detail || ""), err: true });
              ws.close();
              paint();
              return;
            }
            if (msg.type === "sealed") {
              try {
                const opened = await hopOpen(hop.pair.privateKey, hop.peer, current.sandboxId, state.threadId, msg.sealed);
                const from = opened.fromRoleId || msg.fromRoleId || "default";
                state.running = from;
                const role = roles.find((row) => row.roleId === from);
                const last = state.bubbles[state.bubbles.length - 1];
                if (last && last.roleId === from && last.role !== "you") {
                  last.text += opened.delta || "";
                } else {
                  state.bubbles.push({
                    role: "agent",
                    roleId: from,
                    label: (role && role.displayName) || from,
                    text: opened.delta || "",
                  });
                }
                paint();
              } catch {
                state.bubbles.push({
                  role: "error",
                  label: "Error",
                  text: "A reply could not be unlocked — browser. A message arrived from the host but this session could not decrypt it.",
                  err: true,
                });
                paint();
              }
            }
            if (msg.type === "done") {
              state.running = "";
              state.pending = false;
              ws.close();
              saveBubbles();
              paint();
            }
          };
        } catch (err) {
          state.pending = false;
          state.running = "";
          state.bubbles.push({ role: "error", label: "Error", text: formatChainError(err).replace(/<[^>]+>/g, " "), err: true });
          paint();
        }
      }

      try {
        if (!window.indexedDB) {
          state.note = "History will not be saved on this device. Live chat continues in memory.";
        } else {
          await loadBubbles();
        }
      } catch { /* ignore */ }
      await paint();
    }

            health: health,
            hosts: (hostsRes && Array.isArray(hostsRes.hosts))
              ? hostsRes.hosts
              : (Array.isArray(health.hosts) ? health.hosts : []),
          };
          state.force = false;
          state.error = state.error || "";
        } catch (err) {
          shell('<p class="err">' + esc(err.message) + "</p>", { title: "Access", wide: true });
          return;
        }
      }
      const clients = state.payload.clients;
      const sandboxes = state.payload.sandboxes;
      const membersBySandbox = state.payload.membersBySandbox;
      const health = state.payload.health;
        const byId = Object.fromEntries(clients.map((row) => [row.userId, row]));
        const q = (state.query || "").trim().toLowerCase();
        const shown = clients.filter((row) => {
          const hay = ((row.email || "") + " " + (row.name || "")).toLowerCase();
          return !q || hay.includes(q);
        });
        if (!state.selectedId && shown[0]) state.selectedId = shown[0].userId;
        const selected = clients.find((row) => row.userId === state.selectedId) || null;
        const sidecarOn = !!health.sidecar;
        const hosts = Array.isArray(state.payload.hosts) ? state.payload.hosts : [];
        const hostRows = hosts.length
          ? hosts.map(function (h) {
              const id = h.hostId || "";
              return "<tr><td>" + esc(h.hostname || "—") + "</td><td>" + esc(id) +
                "</td><td><span class=\"pill on\">Online</span></td><td class=\"actions\">" +
                '<button type="button" class="ghost" data-host-token="' + esc(id) + '" data-host-name="' +
                esc(h.hostname || "host") + '">New token</button> ' +
                '<button type="button" class="ghost" data-host-revoke="' + esc(id) + '">Revoke</button></td></tr>';
            }).join("")
          : '<tr><td colspan="4" class="muted">No live hosts yet. Connect Halcyon Host; they appear as hostname + Halcyon ID.</td></tr>';
        function pinOptions(selected) {
          const cur = selected || "pool";
          const liveIds = hosts.map(function (h) { return h.hostId || ""; });
          const offline = (cur !== "pool" && liveIds.indexOf(cur) === -1)
            ? '<option value="' + esc(cur) + '" selected>Pin — offline (' + esc(cur) + ")</option>"
            : "";
          return '<option value="pool"' + (cur === "pool" ? " selected" : "") + ">Pool — any connected host</option>" +
            offline +
            hosts.map(function (h) {
              const id = h.hostId || "";
              return '<option value="' + esc(id) + '"' + (cur === id ? " selected" : "") + ">Pin — " +
                esc(h.hostname || id) + " (" + esc(id) + ")</option>";
            }).join("");
        }
        function displayTag(tag) {
          const t = String(tag || "");
          return t.indexOf("ollama/") === 0 ? t.slice(7) : t;
        }
        function modelBand(size) {
          const n = Number(size) || 0;
          if (n > 400 * 1024 * 1024) return "large";
          if (n >= 200 * 1024 * 1024) return "standard";
          return "compact";
        }
        function bandHint(band) {
          if (band === "large") return " — higher capacity";
          if (band === "compact") return " — lower capacity";
          return "";
        }
        function unionModels(hostsList, pinHostId) {
          const src = (hostsList || []).filter(function (h) {
            return !pinHostId || h.hostId === pinHostId;
          });
          const by = {};
          src.forEach(function (h) {
            (h.models || []).forEach(function (m) {
              const tag = m.tag || "";
              if (!tag) return;
              if (!by[tag] || (m.size || 0) > (by[tag].size || 0)) by[tag] = m;
            });
          });
          return Object.keys(by).sort().map(function (k) { return by[k]; });
        }
        function modelOptionValue(tag) {
          const t = String(tag || "");
          return t.indexOf("ollama/") === 0 ? t : "ollama/" + t;
        }
        function modelOptionLabel(m) {
          const band = modelBand(m.size);
          const cap = band.charAt(0).toUpperCase() + band.slice(1);
          return displayTag(m.tag) + " — " + cap + bandHint(band);
        }
        function sandboxModelLine(box) {
          const shown = displayTag(box.modelRef);
          const match = unionModels(hosts, "").find(function (m) {
            return displayTag(m.tag) === shown;
          });
          if (!match) return shown;
          const band = modelBand(match.size);
          const cap = band.charAt(0).toUpperCase() + band.slice(1);
          return shown + " — " + cap + bandHint(band);
        }
        function modelSelectHtml(selectedRef, pinHostId) {
          const models = unionModels(hosts, pinHostId);
          const empty = models.length === 0;
          const values = models.map(function (m) { return modelOptionValue(m.tag); });
          const keep = selectedRef && values.indexOf(selectedRef) !== -1 ? selectedRef : values[0] || "";
          const opts = models.map(function (m) {
            const val = modelOptionValue(m.tag);
            return '<option value="' + esc(val) + '"' + (val === keep ? " selected" : "") + ">" +
              esc(modelOptionLabel(m)) + "</option>";
          }).join("");
          return {
            empty: empty,
            html: '<select name="modelRef"' + (empty ? " disabled" : "") + ">" + opts + "</select>",
          };
        }
        function fillCreateModels(keepValue) {
          const form = document.getElementById("new-box");
          if (!form) return;
          const capSel = form.capacity;
          const modelSel = form.modelRef;
          const createBtn = form.querySelector('button[type="submit"]');
          const pinHostId = !capSel || capSel.value === "pool" ? "" : capSel.value;
          const models = unionModels(hosts, pinHostId);
          const values = models.map(function (m) { return modelOptionValue(m.tag); });
          modelSel.innerHTML = models.map(function (m) {
            return '<option value="' + esc(modelOptionValue(m.tag)) + '">' +
              esc(modelOptionLabel(m)) + "</option>";
          }).join("");
          modelSel.disabled = models.length === 0;
          if (createBtn) createBtn.disabled = models.length === 0 || !sidecarOn;
          if (models.length) {
            modelSel.value = (keepValue && values.indexOf(keepValue) !== -1) ? keepValue : values[0];
          }
        }
        const createModels = modelSelectHtml(state.modelRef, "");
        const createDisabled = createModels.empty || !sidecarOn;
        const usersCol =
          '<section class="card">' +
            "<h2>People</h2>" +
            '<p class="muted">Everyone who has signed in. Select a client, then grant a connection.</p>' +
            '<div class="field"><label>Search</label>' +
              '<input id="user-q" value="' + esc(state.query) + '" placeholder="Name or email" /></div>' +
            '<div class="user-list">' +
              shown.map((row) =>
                '<button type="button" class="user-row' + (row.userId === state.selectedId ? " sel" : "") + '" data-user="' + esc(row.userId) + '">' +
                  esc(row.name || row.email) +
                  "<small>" + esc(row.email) + " · " + esc(row.role) + "</small>" +
                "</button>"
              ).join("") +
            "</div>" +
            '<div class="field" style="margin-top:1.25rem">' +
              "<h3>Invite client</h3>" +
              '<p class="muted">Optional. Prefer they sign up, then grant.</p>' +
              '<form id="invite">' +
                '<div class="field"><label>Name</label><input name="name" required value="' + esc(state.inviteName) + '" /></div>' +
                '<div class="field"><label>Email</label><input name="email" type="email" required value="' + esc(state.inviteEmail) + '" /></div>' +
                '<button class="ghost" type="submit"' + (sidecarOn ? "" : " disabled") + ">Invite and connect</button>" +
              "</form></div>" +
          "</section>";
        const boxesCol =
          '<div class="stack">' +
            '<section class="card" style="padding:0;overflow:hidden">' +
              '<div style="padding:1.1rem 1.15rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:1rem">' +
                "<div><h2>Live hosts</h2><p class=\"muted\">Hostname and Halcyon ID from each connected Host.</p></div>" +
                capacityPill(health) +
              "</div>" +
              '<table class="host-table"><thead><tr><th>Hostname</th><th>Host ID</th><th>Status</th><th></th></tr></thead><tbody>' +
              hostRows + "</tbody></table></section>" +
            '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:1rem">' +
              "<h3>" + (selected ? ("Environments for " + esc(selected.name || selected.email)) : "Environments") + "</h3>" +
            "</div>" +
            sandboxes.map((box) => {
              const members = membersBySandbox[box.sandboxId] || [];
              const member = selected && members.some((m) => m.userId === selected.userId);
              const chips = members.map((m) => {
                const person = byId[m.userId];
                return '<span class="chip">' + esc((person && person.email) || m.userId) + "</span>";
              }).join("");
              const actions = selected
                ? (member
                    ? '<button class="ghost" data-revoke="' + esc(box.sandboxId) + '">Revoke</button>'
                    : '<button class="accent" data-grant="' + esc(box.sandboxId) + '">Grant</button>')
                : '<p class="muted">Select a person.</p>';
              const pin = box.capacityMode === "pin" ? (box.pinnedHostId || "") : "pool";
              return (
                '<article class="card">' +
                  "<h2>" + esc(box.name) + "</h2>" +
                  '<p class="muted">' + esc(sandboxModelLine(box)) + "</p>" +
                  '<div class="field"><label>Capacity</label><select data-capacity="' + esc(box.sandboxId) + '">' +
                    pinOptions(pin) +
                  "</select></div>" +
                  '<div class="chips">' + (chips || '<span class="chip">No members</span>') + "</div>" +
                  '<div class="actions">' + actions + "</div>" +
                "</article>"
              );
            }).join("") +
            (sandboxes.length ? "" : '<article class="card"><p class="muted">No connections yet. Create one below.</p></article>') +
            '<section class="card">' +
              "<h2>New Sandbox</h2>" +
              '<p class="muted">Creates an isolated environment. Not a host.</p>' +
              '<form id="new-box">' +
                '<div class="field"><label>Name</label><input name="name" required value="' + esc(state.name) + '" /></div>' +
                '<div class="field"><label>Model</label>' + createModels.html + "</div>" +
                '<div class="field"><label>Capacity</label><select name="capacity">' + pinOptions("pool") + "</select></div>" +
                '<button class="accent" type="submit"' + (createDisabled ? " disabled" : "") + ">Create</button>" +
              "</form>" +
            "</section>" +
          "</div>";
        const err = state.error ? '<p class="err">' + esc(state.error) + "</p>" : "";
        shell(
          err + '<div class="admin-grid">' + usersCol + boxesCol + "</div>",
          { title: "Access", sub: "Grant isolated environments to signed-in clients", wide: true, health: health }
        );
        const qInput = document.getElementById("user-q");
        qInput.oninput = () => {
          const pos = qInput.selectionStart;
          state.query = qInput.value;
          renderAdmin(state).then(() => {
            const next = document.getElementById("user-q");
            if (next) {
              next.focus();
              next.setSelectionRange(pos, pos);
            }
          });
        };
        app.querySelectorAll("[data-user]").forEach((btn) => {
          btn.onclick = () => {
            state.selectedId = btn.getAttribute("data-user");
            renderAdmin(state);
          };
        });
        app.querySelectorAll("[data-grant]").forEach((btn) => {
          btn.onclick = async () => {
            try {
              await api("/api/admin/sandboxes/" + encodeURIComponent(btn.getAttribute("data-grant")) + "/members", {
                method: "POST",
                body: JSON.stringify({ userId: state.selectedId }),
              });
              state.error = "";
              state.payload = null;
              state.force = true;
              await renderAdmin(state);
            } catch (err) {
              state.error = err.message;
              await renderAdmin(state);
            }
          };
        });
        app.querySelectorAll("[data-capacity]").forEach((sel) => {
          sel.onchange = async () => {
            const fields = capacityBody(sel.value);
            try {
              await api("/api/admin/sandboxes/" + encodeURIComponent(sel.getAttribute("data-capacity")), {
                method: "PATCH",
                body: JSON.stringify(fields),
              });
              state.error = "";
              state.payload = null;
              state.force = true;
              await renderAdmin(state);
            } catch (err) {
              state.error = err.message;
              await renderAdmin(state);
            }
          };
        });
        app.querySelectorAll("[data-revoke]").forEach((btn) => {
          btn.onclick = async () => {
            try {
              await api("/api/admin/sandboxes/" + encodeURIComponent(btn.getAttribute("data-revoke")) + "/members", {
                method: "DELETE",
                body: JSON.stringify({ userId: state.selectedId }),
              });
              state.error = "";
              state.payload = null;
              state.force = true;
              await renderAdmin(state);
            } catch (err) {
              state.error = err.message;
              await renderAdmin(state);
            }
          };
        });
        app.querySelectorAll("[data-host-revoke]").forEach((btn) => {
          btn.onclick = async () => {
            try {
              await api("/api/admin/hosts/" + encodeURIComponent(btn.getAttribute("data-host-revoke")) + "/token", {
                method: "DELETE",
              });
              state.error = "";
              state.payload = null;
              state.force = true;
              await renderAdmin(state);
            } catch (err) {
              state.error = err.message;
              await renderAdmin(state);
            }
          };
        });
        app.querySelectorAll("[data-host-token]").forEach((btn) => {
          btn.onclick = async () => {
            try {
              const minted = await api("/api/admin/hosts/" + encodeURIComponent(btn.getAttribute("data-host-token")) + "/token", {
                method: "POST",
                body: JSON.stringify({ hostname: btn.getAttribute("data-host-name") || "host" }),
              });
              const token = minted.hostSidecarToken || "";
              if (navigator.clipboard && token) {
                await navigator.clipboard.writeText(token);
              }
              window.alert(token ? ("Copied host token once. It will not be shown again.\n" + token) : "Token minted.");
              state.error = "";
            } catch (err) {
              state.error = err.message;
              await renderAdmin(state);
            }
          };
        });
        const newBoxForm = document.getElementById("new-box");
        newBoxForm.capacity.onchange = function () {
          fillCreateModels(newBoxForm.modelRef.value);
        };
        newBoxForm.onsubmit = async (event) => {
          event.preventDefault();
          const form = event.target;
          try {
            const created = await api("/api/admin/sandboxes", {
              method: "POST",
              body: JSON.stringify(Object.assign({
                name: form.name.value,
                modelRef: form.modelRef.value,
              }, capacityBody(form.capacity.value))),
            });
            if (state.selectedId && created.sandbox && created.sandbox.sandboxId) {
              await api("/api/admin/sandboxes/" + encodeURIComponent(created.sandbox.sandboxId) + "/members", {
                method: "POST",
                body: JSON.stringify({ userId: state.selectedId }),
              });
            }
            state.name = "";
            state.error = "";
            state.payload = null;
            state.force = true;
            await renderAdmin(state);
          } catch (err) {
            state.error = err.message;
            await renderAdmin(state);
          }
        };
        document.getElementById("invite").onsubmit = async (event) => {
          event.preventDefault();
          const form = event.target;
          try {
            await api("/api/admin/clients", {
              method: "POST",
              body: JSON.stringify({
                email: form.email.value,
                name: form.name.value,
                modelRef: state.modelRef,
              }),
            });
            state.inviteEmail = "";
            state.inviteName = "";
            state.error = "";
            state.payload = null;
            state.force = true;
            await renderAdmin(state);
          } catch (err) {
            state.error = err.message;
            await renderAdmin(state);
          }
        };
    }

    async function loadApp() {
      const view = route();
      try {
        const sandboxes = await api("/api/sandboxes");
        me = sandboxes.me;
        if (view.name === "admin") {
          if (!me || me.role !== "admin") {
            shell('<p class="err">Access is for administrators only.</p>');
            return;
          }
          await renderAdmin();
          return;
        }
        const hasMembership = !!(sandboxes.sandboxes && sandboxes.sandboxes.length);
        if (!hasMembership) {
          if (view.name === "workspace") {
            shell(
              '<p class="banner">' + formatChainError({
                title: "No environment yet",
                stage: "portal",
                detail: "You do not have an isolated environment. An admin must grant one in Access.",
              }) + "</p>",
              { title: "Workspace" },
            );
            return;
          }
          showSample(view.name === "workspace" ? { name: "home" } : view);
          return;
        }
        try {
          if (view.name === "workspace") {
            await renderWorkspace(sandboxes.sandboxes);
            return;
          }
          if (view.name === "detail") {
            const local = sampleInsight(view.id);
            if (local) {
              renderDetail(local, { sample: true });
              return;
            }
            const data = await api("/api/insights/" + encodeURIComponent(view.id));
            renderDetail(data.insight, { sample: false });
            return;
          }
          const [insights, metrics] = await Promise.all([
            api("/api/insights"),
            api("/api/metrics/summary"),
          ]);
          renderHome(insights.insights, metrics.metrics, { sample: false });
        } catch (err) {
          if (/sign in|unauthorized|401/i.test(err.message)) throw err;
          showSample(view, err.message);
        }
      } catch (err) {
        if (/sign in|unauthorized|401/i.test(err.message)) {
          sessionStorage.removeItem(TOKENS);
          me = null;
          loginView(err.message);
          return;
        }
        showSample(view, err.message);
      }
    }

    async function boot() {
      try {
        const res = await fetch("/config.json", { cache: "no-store" });
        if (!res.ok) throw new Error("config " + res.status);
        cfg = await res.json();
      } catch {
        app.innerHTML = '<div class="login"><main><p class="err">Config missing. Apply terraform so /config.json exists.</p></main></div>';
        return;
      }
      const params = new URLSearchParams(location.search);
      if (params.get("code")) {
        try {
          await exchangeCode(params.get("code"), params.get("state"));
        } catch (err) {
          loginView(err.message);
          return;
        }
      }
      if (!tokens() || !tokens().id_token) {
        loginView("");
        return;
      }
      window.onhashchange = () => loadApp();
      loadApp();
    }

    boot();
  </script>
</body>
</html>
