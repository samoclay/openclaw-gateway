<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halcyon sandbox</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: #0c1014;
      color: #e8eef4;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      max-width: 36rem;
      padding: 2rem;
    }
    p.kicker {
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #3ee0b2;
      font-size: 0.75rem;
    }
    a {
      color: #3ee0b2;
    }
    code { color: #8aa0b5; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Halcyon</p>
    <h1>Sandbox console</h1>
    <p>Sign up or sign in. Email verification is required. An admin must still grant you a sandbox before you can talk to a model.</p>
    <p><a id="login" href="#">Open hosted login</a></p>
    <p>API: <code id="api">https://app.halcyonlabs.uk/api</code><br />Chat socket: <code id="ws">wss://ws.app.halcyonlabs.uk</code></p>
  </main>
  <script>
    fetch("/config.json", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("config " + res.status);
        return res.json();
      })
      .then(function (cfg) {
        var host = cfg.host;
        var wsHost = cfg.wsHost;
        var domain = cfg.cognitoDomain;
        var clientId = cfg.cognitoClientId;
        var redirect = "https://" + host;
        document.getElementById("api").textContent = "https://" + host + "/api";
        document.getElementById("ws").textContent = "wss://" + wsHost;
        document.getElementById("login").href =
          "https://" + domain + "/login?client_id=" + encodeURIComponent(clientId)
          + "&response_type=code&scope=" + encodeURIComponent("email openid profile")
          + "&redirect_uri=" + encodeURIComponent(redirect);
      })
      .catch(function () {
        document.getElementById("login").textContent = "Config missing (apply terraform config.json)";
        document.getElementById("login").removeAttribute("href");
      });
  </script>
</body>
</html>
